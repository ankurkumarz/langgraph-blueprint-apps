[project]
name = "langgraph-fastapi-streaming"
version = "0.1.0"
description = "Registry-driven multi-agent LangGraph orchestrator with FastAPI SSE streaming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai==4.0.0",
    "langchain-mcp-adapters==0.2.1",
    "langgraph==1.0.4",
    "langgraph-prebuilt==1.0.4",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "agentevals>=0.0.9",
    "mlflow==3.7.0",
    "fastapi==0.124.2",
    "uvicorn[standard]>=0.30.0",
    "aiofiles>=23.0.0",
    "langchain>=1.2.6",
    "pydantic-settings>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
